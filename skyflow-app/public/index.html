<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyFlow AI — Login & Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white border border-slate-200 rounded-3xl p-8 shadow-xl">
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-400 to-blue-600 flex items-center justify-center text-white text-3xl mx-auto shadow-md mb-3">
                🤖
            </div>
            <h1 class="text-2xl font-black text-slate-900">SkyFlow <span class="text-sky-600">AI</span></h1>
            <p class="text-xs text-slate-500 mt-1">เข้าสู่ระบบเพื่อใช้งาน Intent-Driven Concierge</p>
        </div>

        <div id="alertBox" class="hidden p-3 rounded-xl text-xs font-semibold mb-4 text-center"></div>

        <div class="flex bg-slate-100 p-1 rounded-xl mb-6 text-xs font-bold">
            <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 rounded-lg bg-white shadow text-sky-600 transition">เข้าสู่ระบบ</button>
            <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 rounded-lg text-slate-500 transition">สมัครสมาชิก</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username หรือ E-mail</label>
                <input type="text" id="loginUsername" placeholder="กรอก Username หรือ อีเมล" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="loginPassword" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm cursor-pointer">
                เข้าสู่ระบบ ➔
            </button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">ชื่อ-นามสกุล</label>
                <input type="text" id="regName" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username</label>
                <input type="text" id="regUsername" onblur="checkUsernameAvailability()" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                <span id="userCheckMsg" class="text-[11px] mt-1 block"></span>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">E-mail</label>
                <input type="email" id="regEmail" onblur="checkEmailAvailability()" placeholder="example@domain.com" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                <span id="emailCheckMsg" class="text-[11px] mt-1 block"></span>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="regPassword" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm cursor-pointer">
                สมัครสมาชิก
            </button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('registerForm').classList.toggle('hidden', isLogin);
            document.getElementById('tabLogin').className = isLogin ? "flex-1 py-2 rounded-lg bg-white shadow text-sky-600 transition" : "flex-1 py-2 rounded-lg text-slate-500 transition";
            document.getElementById('tabRegister').className = !isLogin ? "flex-1 py-2 rounded-lg bg-white shadow text-sky-600 transition" : "flex-1 py-2 rounded-lg text-slate-500 transition";
        }

        function showAlert(msg, isError = false) {
            const box = document.getElementById('alertBox');
            box.className = `p-3 rounded-xl text-xs font-semibold mb-4 text-center ${isError ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'}`;
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        async function checkUsernameAvailability() {
            const username = document.getElementById('regUsername').value.trim();
            if (!username) return;
            const res = await fetch(`/check-username/${username}`);
            const data = await res.json();
            const msg = document.getElementById('userCheckMsg');
            if (data.available) {
                msg.className = "text-[11px] text-emerald-600 font-bold mt-1 block";
                msg.innerText = "✓ Username นี้สามารถใช้ได้";
            } else {
                msg.className = "text-[11px] text-red-500 font-bold mt-1 block";
                msg.innerText = "✕ Username นี้ถูกใช้งานแล้ว";
            }
        }

        async function checkEmailAvailability() {
            const email = document.getElementById('regEmail').value.trim();
            if (!email) return;
            const res = await fetch(`/check-email/${encodeURIComponent(email)}`);
            const data = await res.json();
            const msg = document.getElementById('emailCheckMsg');
            if (data.available) {
                msg.className = "text-[11px] text-emerald-600 font-bold mt-1 block";
                msg.innerText = "✓ Email นี้สามารถใช้ได้";
            } else {
                msg.className = "text-[11px] text-red-500 font-bold mt-1 block";
                msg.innerText = "✕ Email นี้ถูกใช้งานแล้ว";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('loginUsername').value,
                    password: document.getElementById('loginPassword').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                showAlert('เข้าสู่ระบบสำเร็จ! กำลังนำคุณไปยังระบบ SkyFlow AI...');
                setTimeout(() => window.location.href = '/flight.html', 1000);
            } else {
                showAlert(data.message, true);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('regName').value,
                    username: document.getElementById('regUsername').value,
                    email: document.getElementById('regEmail').value,
                    password: document.getElementById('regPassword').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                showAlert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
                switchTab('login');
            } else {
                showAlert(data.message, true);
            }
        }
    </script>
</body>
</html>

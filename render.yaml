# ==============================================================================
# SkyFlow - Render.com Blueprint (Infrastructure as Code)
# 100% Free Cloud Deployment Configuration
# ==============================================================================

services:
  # SkyFlow Fullstack Web Service (Express API + Web Frontend)
  - type: web
    name: skyflow-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FLIGHTAPI_KEY
        value: 6abe10cfe1ceafff6e5b16d3
      # Automatically wire Render PostgreSQL connection string
      - key: DATABASE_URL
        fromDatabase:
          name: skyflow-db
          property: connectionString

# Free Managed PostgreSQL Database on Render
databases:
  - name: skyflow-db
    databaseName: skyflow_db
    user: skyflow_user
    plan: free
    region: singapore
